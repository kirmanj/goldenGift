name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.7'

jobs:
  mobile:
    name: Mobile app (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash ../.github/scripts/stub_firebase_options.sh .
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Generated l10n is up to date
        run: git diff --exit-code -- lib/l10n
      - name: Legal pages match docs/legal (docs/tools/build_legal_pages.py)
        run: python3 ../docs/tools/build_legal_pages.py --check
      - run: flutter analyze
      - run: flutter test

  admin:
    name: Admin dashboard (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminDashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash ../.github/scripts/stub_firebase_options.sh .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions:
    name: Cloud Functions (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  functions-emulator:
    name: Cloud Functions (emulator + security rules tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/functions/package-lock.json
      - run: npm ci
        working-directory: mobile/functions
      - run: npm install -g firebase-tools@15
      - name: Emulator suites (processNewUser, deleteAccount, runOnce, Firestore + Storage rules)
        run: >-
          firebase emulators:exec --only auth,firestore,storage --project goldengift-iq
          "npm --prefix mobile/functions test"
