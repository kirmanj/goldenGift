# Android release build (SRS §10 Phase 10) — docs/RELEASE.md.
#
# Tag `vX.Y.Z` (must match mobile/pubspec.yaml) or run it by hand. Builds a signed
# App Bundle, keeps it as a workflow artifact and, when PLAY_SERVICE_ACCOUNT_JSON
# is set, uploads it to the Google Play INTERNAL testing track. Without the
# keystore secrets the bundle is debug-signed (proves the build) and never uploaded.
name: Release · Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_number:
        description: 'versionCode override (empty = BUILD_NUMBER_OFFSET + run number)'
        required: false
        default: ''
      play_status:
        description: 'Play release status — "draft" while the app has never been published'
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.38.7' # keep in step with ci.yml
  AAB_PATH: mobile/build/app/outputs/bundle/release/app-release.aab

jobs:
  android:
    name: App Bundle → Play internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version and build number
        id: version
        env:
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash ../.github/scripts/release_build_info.sh pubspec.yaml

      - name: Firebase config (git-ignored files from secrets)
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: bash ../.github/scripts/write_firebase_config.sh . dart android

      - name: Upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::ANDROID_KEYSTORE_B64 is set but $name is not — see docs/RELEASE.md."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d ' \r\n' | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: No keystore — debug-signed build only
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_B64 is not set — the bundle is signed with the DEBUG key and is not uploaded to Google Play."

      - name: Dart defines
        env:
          # Map pin only when enabled AND the Android key exists (SRS §5.20).
          MAPS_ENABLED: ${{ vars.MAPS_ENABLED == 'true' && secrets.ANDROID_MAPS_API_KEY != '' }}
          DART_DEFINES_JSON: ${{ secrets.DART_DEFINES_JSON }}
        run: bash ../.github/scripts/write_dart_defines.sh "$RUNNER_TEMP/dart_defines.json"

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Build App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.ANDROID_MAPS_API_KEY }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: >-
          flutter build appbundle --release
          --build-number="$BUILD_NUMBER"
          --dart-define-from-file="$RUNNER_TEMP/dart_defines.json"

      - name: Check the signing certificate
        working-directory: .
        run: |
          owner="$(keytool -printcert -jarfile "$AAB_PATH" | grep -m1 'Owner:' || true)"
          echo "Signed by: $owner"
          if [[ "$HAS_KEYSTORE" == 'true' && "$owner" == *"Android Debug"* ]]; then
            echo "::error::The bundle is debug-signed although a keystore was provided."
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: golden-gift-android-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_number }}
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY == 'true' && env.HAS_KEYSTORE == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.goldengift.golden_gift
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
          status: ${{ inputs.play_status || 'completed' }}

      - name: Summary
        if: always()
        working-directory: .
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          {
            echo "### Golden Gift Android ${VERSION_NAME:-?} (${BUILD_NUMBER:-?})"
            echo "- Signing: $([[ "$HAS_KEYSTORE" == 'true' ]] && echo 'upload key' || echo '**debug key** (ANDROID_KEYSTORE_B64 missing)')"
            if [[ "$HAS_PLAY" == 'true' && "$HAS_KEYSTORE" == 'true' ]]; then
              echo "- Google Play: uploaded to the internal track (see the step above for the result)"
            else
              echo "- Google Play: skipped (needs PLAY_SERVICE_ACCOUNT_JSON + the keystore secrets)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
