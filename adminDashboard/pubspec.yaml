name: golden_gift_admin
description: "Golden Gift Admin Dashboard — Platform Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3
  firebase_app_check: ^0.3.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # UI
  fl_chart: ^0.69.0
  data_table_2: ^2.5.15
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  timeago: ^3.6.1
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  flutter_colorpicker: ^1.1.0

  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  web: ^1.1.0

  # Shared with the customer app: models, parsers, search tokenizer, query keys,
  # enums and Firestore paths — one definition, so the dashboard writes exactly
  # what the app reads (CLAUDE.md "must NOT diverge").
  golden_gift:
    path: ../mobile

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/
